name: Generate IP-based playlist

on:
  push:
    paths:
      - '*.m3u'
  schedule:
    - cron: '45 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate IP variants
        run: |
          for f in *.m3u; do
            grep -q 'iptv\.local' "$f" || continue
            out="${f%.m3u}-ip.m3u"
            sed 's/iptv\.local/192.168.5.1/g' "$f" > "$out"
            echo "generated $out from $f"
          done
      - name: Merge TVOD catchup-source into timeshift IP playlist
        run: |
          f="iptv-unicast-timeshift-ts2hls-ip.m3u"
          if [ ! -f "$f" ]; then echo "$f not found, skipping"; exit 0; fi
          curl -sL -o /tmp/iptv_tvod.m3u "https://raw.githubusercontent.com/comanche2008/iptv/refs/heads/main/iptv-unicast-timeshift-ts2hls.m3u"
          if ! head -1 /tmp/iptv_tvod.m3u | grep -q '^#EXTM3U'; then echo "iptv repo playlist download failed, skipping TVOD merge"; exit 0; fi
          python3 - "$f" /tmp/iptv_tvod.m3u << 'PYEOF'
          import re, sys
          target, src = sys.argv[1], sys.argv[2]
          def parse(path):
              with open(path, encoding='utf-8') as fh:
                  lines = fh.read().splitlines()
              entries = []
              i = 0
              while i < len(lines):
                  if lines[i].startswith('#EXTINF'):
                      entries.append((lines[i], lines[i+1] if i+1 < len(lines) else ''))
                      i += 2
                  else:
                      i += 1
              return entries
          def tvg(e):
              m = re.search(r'tvg-id="([^"]*)"', e)
              return m.group(1) if m else None
          def cname(e):
              return e.rsplit(',', 1)[-1].strip()
          def csrc(e):
              m = re.search(r'catchup-source="([^"]*)"', e)
              return m.group(1) if m else None
          by_tvg, by_name = {}, {}
          for e, _ in parse(src):
              s = csrc(e)
              if s:
                  if tvg(e):
                      by_tvg[tvg(e)] = s
                  by_name[cname(e)] = s
          with open(target, encoding='utf-8') as fh:
              tlines = fh.read().splitlines()
          out, n = [], 0
          for line in tlines:
              if line.startswith('#EXTM3U'):
                  line = re.sub(r'\s+catchup="[^"]*"', '', line)
                  line = re.sub(r'\s+catchup-source="[^"]*"', '', line)
                  out.append(line)
                  continue
              if line.startswith('#EXTINF'):
                  line = re.sub(r'\s+catchup="[^"]*"', '', line)
                  line = re.sub(r'\s+catchup-source="[^"]*"', '', line)
                  s = by_tvg.get(tvg(line)) or by_name.get(cname(line))
                  if s:
                      head, _, nm = line.rpartition(',')
                      line = head + ' catchup="default" catchup-source="' + s + '",' + nm
                      n += 1
                  out.append(line)
                  continue
              out.append(line)
          with open(target, 'w', encoding='utf-8') as fh:
              fh.write('\n'.join(out) + '\n')
          print(f"merged TVOD catchup-source into {n} channels")
          PYEOF
          echo "--- verify ---"
          head -1 "$f"
          echo "channels with catchup-source: $(grep -c 'catchup-source=' "$f")"
          echo "channels total: $(grep -c '^#EXTINF' "$f")"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- '*-ip.m3u'
          git diff --cached --quiet || { git commit -m "Auto-generate IP-based playlist variants"; git push; }
