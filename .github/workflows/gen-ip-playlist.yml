name: Generate IP-based playlist

on:
  push:
    paths:
      - '*.m3u'
  schedule:
    - cron: '45 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate IP variants
        run: |
          for f in *.m3u; do
            grep -q 'iptv\.local' "$f" || continue
            out="${f%.m3u}-ip.m3u"
            sed 's/iptv\.local/192.168.5.1/g' "$f" > "$out"
            echo "generated $out from $f"
          done
      - name: Add header-level catchup to timeshift IP playlist
        run: |
          f="iptv-unicast-timeshift-ts2hls-ip.m3u"
          if [ -f "$f" ]; then
            # Drop the 3 dead per-channel TVOD catchup attributes so all
            # channels use the header template below
            sed -i -E 's/ catchup="default" catchup-source="[^"]*"//g' "$f"
            # Header-level catchup: APTV appends ?playseek=<start>-<end>
            # to the stream URL when the user picks a past programme
            sed -i '1s/$/ catchup="append" catchup-source="?playseek=${(b)yyyyMMddHHmmss}-${(e)yyyyMMddHHmmss}"/' "$f"
            echo "added catchup header to $f"
            head -1 "$f"
          fi
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- '*-ip.m3u'
          git diff --cached --quiet || { git commit -m "Auto-generate IP-based playlist variants"; git push; }
