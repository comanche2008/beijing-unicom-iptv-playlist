name: Generate IP-based playlist

on:
  push:
    paths:
      - '*.m3u'
  schedule:
    - cron: '45 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate IP variants
        run: |
          for f in *.m3u; do
            grep -q 'iptv\.local' "$f" || continue
            out="${f%.m3u}-ip.m3u"
            sed 's/iptv\.local/192.168.5.1/g' "$f" > "$out"
            echo "generated $out from $f"
          done
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- '*-ip.m3u'
          git diff --cached --quiet || { git commit -m "Auto-generate IP-based playlist variants"; git push; }
